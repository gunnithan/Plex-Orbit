services:
  plex:
    image: plexinc/pms-docker:latest
    container_name: plex
    devices:
      - /dev/dri:/dev/dri
    volumes:
      - /opt/plex/library:/config
      - /opt/plex/transcode:/transcode
      - /media/unnit/plexmedia:/Media
      - /home/unnit/Music:/Music
    environment:
      - TZ=Europe/London
      - PLEX_UID=1000                                           ## Same as PUID
      - PLEX_GID=1000                                           ## Same as PGID
      - PLEX_CLAIM=claim-ZpxHCNk82c7hGEJVN7oi                   ## Need for the first run of Plex - get claimToken here https://www.plex.tv/claim/
    ports:
      - "32400:32400"
    healthcheck:
      test: curl --connect-timeout 15 --silent --show-error --fail http://localhost:32400/identity
      interval: 1m00s
      timeout: 15s
      retries: 3
      start_period: 1m00s
    restart: always

